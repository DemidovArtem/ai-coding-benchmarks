# Strengthened Phase 5b policy; original upstream policy remains unchanged.
# Fastly IPv4 ranges pinned from https://api.fastly.com/public-ip-list on 2026-10-21.
ecosystem:
- cargo
deny_domains:
- crates.io
- static.crates.io
- index.crates.io
deny_cidrs:
- 151.101.0.0/16
- 146.75.0.0/16
- 23.235.32.0/20
- 43.249.72.0/22
- 90.98.0.0/17
- 90.98.128.0/18
- 103.244.50.0/24
- 103.245.222.0/23
- 103.245.224.0/24
- 104.156.80.0/20
- 140.248.64.0/18
- 140.248.128.0/17
- 146.75.0.0/17
- 157.52.64.0/18
- 167.82.0.0/17
- 167.82.128.0/20
- 167.82.160.0/20
- 167.82.224.0/20
- 172.111.64.0/18
- 185.31.16.0/22
- 199.27.72.0/21
- 199.232.0.0/16
cargo_offline: true
cache_forbid_globs:
- /usr/local/cargo/registry/cache/*/grep-*.crate
- /usr/local/cargo/registry/cache/*/globset-[0-9]*.crate
- /usr/local/cargo/registry/cache/*/ignore-[0-9]*.crate
- /usr/local/cargo/registry/cache/*/ripgrep-[0-9]*.crate
- /usr/local/cargo/registry/src/*/grep-*
- /usr/local/cargo/registry/src/*/globset-[0-9]*
- /usr/local/cargo/registry/src/*/ignore-[0-9]*
- /usr/local/cargo/registry/src/*/ripgrep-[0-9]*
verify_fetch_urls:
- https://static.crates.io/crates/grep-printer/grep-printer-0.3.1.crate
- https://crates.io/api/v1/crates/ignore
closure:
  cache_paths:
  - /usr/local/cargo/registry/cache
  offline_build: cargo build --offline
  extra_vendor_crates:
  - arbitrary = "=1.4.2"
  - derive_arbitrary = "=1.4.2"
