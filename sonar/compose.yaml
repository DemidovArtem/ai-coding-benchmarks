name: ai-coding-sonar

services:
  server:
    image: sonarqube@sha256:c0f1160bccfa435db4168c2d7df69af3c3ea7bfeb87395613014048fb33a68c1
    platform: linux/amd64
    pull_policy: never
    ports:
      - "127.0.0.1:9000:9000"
    networks: [analysis]
    volumes:
      - data:/opt/sonarqube/data
      - extensions:/opt/sonarqube/extensions
      - logs:/opt/sonarqube/logs
    mem_limit: 4g
    cpus: 2
    security_opt: ["no-new-privileges:true"]
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc: 8192

  scanner:
    profiles: [scan]
    image: sonarsource/sonar-scanner-cli@sha256:a3f4215076706c95a17a68c19322ee916e40a3acd081a8c1a1e839e0194afa57
    platform: linux/amd64
    pull_policy: never
    networks: [analysis]
    working_dir: /workspace
    environment:
      - SONAR_HOST_URL=http://server:9000
      - SONAR_TOKEN
    mem_limit: 2g
    cpus: 2
    security_opt: ["no-new-privileges:true"]

networks:
  analysis:
    name: ai-coding-sonar-internal
    internal: true

volumes:
  data:
  extensions:
  logs:
